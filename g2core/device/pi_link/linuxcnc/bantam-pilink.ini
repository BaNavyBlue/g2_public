# Bantam Tools Desktop CNC (TinyG v9k board) driven by LinuxCNC over the g2core Pi link.
# Deliberately slow first config: 10 mm/s on X/Y, 5 mm/s on Z. See HAL-DRIVER.md.
#
# Machine coordinates follow g2core's: X/Y home to their minimum switch, Z to the top; each
# switch trips 0.4 mm past 0 (g2core's zero backoff), so 0 is 0.4 mm off the switch.
# The step counts are not absolute: LinuxCNC must home after every start.

[EMC]
VERSION = 1.1
MACHINE = Bantam Pi link
DEBUG = 0

[DISPLAY]
DISPLAY = axis
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.2
DEFAULT_LINEAR_VELOCITY = 2
MAX_LINEAR_VELOCITY = 10
MIN_LINEAR_VELOCITY = 0.1
PROGRAM_PREFIX = ~/linuxcnc/nc_files
INCREMENTS = 1 mm, 0.1 mm, 0.01 mm

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
RS274NGC_STARTUP_CODE = G21 G17 G40 G49 G54 G80 G90 G94

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[PILINK]
# Driver settings (pilink.* in bantam-pilink.hal)
PORT = /dev/ttyAMA0
BAUD = 2000000
# 1000 us: 500 us segments fail the board's exec-time budget with four motors moving
SEGMENT_US = 1000
WATCHDOG_MS = 5
# Position loop: feed-forward plus P (1/s) on the error against the command LATENCY periods back
P_GAIN = 30
LATENCY = 2.0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[HAL]
HALFILE = bantam-pilink.hal

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 5
MAX_LINEAR_VELOCITY = 10
DEFAULT_LINEAR_ACCELERATION = 100
MAX_LINEAR_ACCELERATION = 200

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[AXIS_X]
MIN_LIMIT = 0
MAX_LIMIT = 185
MAX_VELOCITY = 10
MAX_ACCELERATION = 200

[AXIS_Y]
MIN_LIMIT = 0
MAX_LIMIT = 237
MAX_VELOCITY = 10
MAX_ACCELERATION = 200

[AXIS_Z]
MIN_LIMIT = -110
MAX_LIMIT = 0
MAX_VELOCITY = 5
MAX_ACCELERATION = 100

# X: motor 1, 200 steps/mm, home switch in1 at the minimum end
[JOINT_0]
TYPE = LINEAR
SCALE = 200
MIN_LIMIT = 0
MAX_LIMIT = 185
MAX_VELOCITY = 10
MAX_ACCELERATION = 200
# The driver's own limits, a little above the joint's; STOP_DECEL is the board's stop
STEPGEN_MAXVEL = 12.5
STEPGEN_MAXACCEL = 250
STOP_DECEL = 500
FERROR = 1.0
MIN_FERROR = 0.25
HOME = 0
HOME_OFFSET = -0.4
HOME_SEARCH_VEL = -5
HOME_LATCH_VEL = -0.5
HOME_FINAL_VEL = 2
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 1

# Y: motor 2, 200 steps/mm, home switch in3 at the minimum end
[JOINT_1]
TYPE = LINEAR
SCALE = 200
MIN_LIMIT = 0
MAX_LIMIT = 237
MAX_VELOCITY = 10
MAX_ACCELERATION = 200
STEPGEN_MAXVEL = 12.5
STEPGEN_MAXACCEL = 250
STOP_DECEL = 500
FERROR = 1.0
MIN_FERROR = 0.25
HOME = 0
HOME_OFFSET = -0.4
HOME_SEARCH_VEL = -5
HOME_LATCH_VEL = -0.5
HOME_FINAL_VEL = 2
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 1

# Z: motor 3, 400 steps/mm, home switch in6 at the top
[JOINT_2]
TYPE = LINEAR
SCALE = 400
MIN_LIMIT = -110
MAX_LIMIT = 0
MAX_VELOCITY = 5
MAX_ACCELERATION = 100
STEPGEN_MAXVEL = 6.25
STEPGEN_MAXACCEL = 125
STOP_DECEL = 250
FERROR = 1.0
MIN_FERROR = 0.25
HOME = 0
HOME_OFFSET = 0.4
HOME_SEARCH_VEL = 5
HOME_LATCH_VEL = 0.5
HOME_FINAL_VEL = 2
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 0
